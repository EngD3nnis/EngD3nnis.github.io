<script>
(function(){

/* --- Accent color per row --- */
(function(){
  var root = document.documentElement;
  var meta = document.querySelector('meta[name="theme-color"]');
  var rows = [].slice.call(document.querySelectorAll('.row'));
  var accents = rows.map(function(r){ return r.style.getPropertyValue('--c').trim(); });
  var base = accents[Math.floor(Math.random() * accents.length)];

  function setAccent(c){ root.style.setProperty('--accent', c); }
  function syncTheme(){ meta.setAttribute('content', getComputedStyle(document.body).backgroundColor); }

  setAccent(base);
  syncTheme();

  var mq = window.matchMedia('(prefers-color-scheme: dark)');
  (mq.addEventListener ? mq.addEventListener.bind(mq, 'change') : mq.addListener.bind(mq))(syncTheme);

  rows.forEach(function(row, i){
    function on(){ setAccent(accents[i]); }
    function off(){ setAccent(base); }
    row.addEventListener('mouseenter', on);
    row.addEventListener('focus', on);
    row.addEventListener('mouseleave', off);
    row.addEventListener('blur', off);
  });
})();

/* --- Scaffold (decorative grid strings) --- */
(function(){
  var host = document.querySelector('.scaffold');
  var sheet = document.querySelector('.sheet');
  var NS = 'http://www.w3.org/2000/svg';
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  var SEG = 20;
  var REACH = 250;
  var LEAN = 22;
  var strings = [], W = 0, H = 0;

  var svg = document.createElementNS(NS, 'svg');
  svg.setAttribute('preserveAspectRatio', 'none');
  host.appendChild(svg);

  function build(){
    var r = host.getBoundingClientRect();
    if (!r.width || !r.height) return;
    W = r.width; H = r.height;
    svg.setAttribute('viewBox', '0 0 ' + W + ' ' + H);

    var n = window.innerWidth < 760 ? 6 : 12;
    var gut = parseFloat(getComputedStyle(sheet).paddingLeft);
    var col = (W - (n - 1) * gut) / n;

    svg.textContent = '';
    strings = [];
    for (var i = 0; i < n; i++){
      var s = {
        x: Math.round(i * (col + gut)) + 0.5,
        phase: i * 1.71,
        bow: 0, v: 0, bowY: H / 2, target: 0, targetY: H / 2,
        ln: document.createElementNS(NS, 'path'),
        hot: document.createElementNS(NS, 'path')
      };
      s.ln.setAttribute('class', 'ln');
      s.hot.setAttribute('class', 'hot');
      svg.appendChild(s.ln);
      svg.appendChild(s.hot);
      strings.push(s);
    }
    if (reduce) draw(0);
  }

  function disp(s, y, t){
    var v = s.bow * Math.exp(-Math.pow((y - s.bowY) / (H * 0.36), 2));
    v += 0.5 * Math.sin(t * 0.8 + s.phase);
    return v * Math.sin(Math.PI * y / H);
  }

  function draw(t){
    for (var i = 0; i < strings.length; i++){
      var s = strings[i];
      s.v = (s.v + (s.target - s.bow) * 0.028) * 0.75;
      s.bow += s.v;
      s.bowY += (s.targetY - s.bowY) * 0.055;

      var d = '';
      for (var j = 0; j <= SEG; j++){
        var y = j * H / SEG;
        d += (j ? ' L ' : 'M ') + (s.x + (reduce ? 0 : disp(s, y, t))).toFixed(2) + ',' + y.toFixed(1);
      }
      s.ln.setAttribute('d', d);
      s.hot.setAttribute('d', d);
      s.hot.style.opacity = reduce ? 0
        : Math.min(0.85, (Math.abs(s.bow) / LEAN + Math.abs(s.v) * 0.12) * 0.9).toFixed(3);
    }
  }

  build();

  var rt;
  window.addEventListener('resize', function(){ clearTimeout(rt); rt = setTimeout(build, 150); });

  if (reduce) return;

  var raf;
  function loop(now){ draw(now / 1000); raf = requestAnimationFrame(loop); }
  raf = requestAnimationFrame(loop);

  document.addEventListener('visibilitychange', function(){
    cancelAnimationFrame(raf);
    if (!document.hidden) raf = requestAnimationFrame(loop);
  });

  document.addEventListener('pointermove', function(e){
    if (e.pointerType === 'touch') return;
    var r = host.getBoundingClientRect();
    var mx = e.clientX - r.left, my = e.clientY - r.top;
    for (var i = 0; i < strings.length; i++){
      var s = strings[i], u = (mx - s.x) / REACH;
      s.target = LEAN * u * Math.exp(-3 * u * u) / 0.2476;
      s.targetY = Math.max(0, Math.min(H, my));
    }
  }, {passive: true});

  document.addEventListener('pointerleave', function(){
    for (var i = 0; i < strings.length; i++) strings[i].target = 0;
  });
})();

})();
</script>
